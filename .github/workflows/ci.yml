name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: swift test
        run: |
          for package in CoachCore CoachIntelligence CoachHealth; do
            echo "::group::$package"
            swift test --package-path "Packages/$package"
            echo "::endgroup::"
          done
          swift build --package-path Packages/CoachUI

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS-26")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -scheme LiveCoach \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build test | tee build/xcodebuild.log | grep -E "error:|warning:|Test run|\*\* (BUILD|TEST)"
